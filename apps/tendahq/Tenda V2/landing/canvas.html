<script type="text/babel">
const { useEffect, useRef } = React;

/* ----------------------------------------------------------------
   SectionFrame — wraps an iframe pointing at one of the section files,
   strips its canvas chrome and shows the targeted .frame-wrap (idx).
   Same trick as landing.html but isolated per artboard.
---------------------------------------------------------------- */
const baseCSS = `
  html, body { background: transparent !important; padding: 0 !important; margin: 0 !important; }
  body { padding: 0 !important; min-height: 0 !important; }
  .canvas-header, .notes, .frame-row-title, .frame-label { display: none !important; }
  .frame-row { gap: 0 !important; }
  .frames { gap: 0 !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
  .frame-wrap { gap: 0 !important; align-items: stretch !important; margin-top: 0 !important; }
  .frame-w, .frame-mw, .frame {
    border-radius: 0 !important;
    box-shadow: none !important;
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
  }
`;

function SectionFrame({ src, targetIndex = 0, width, height }) {
  const ref = useRef(null);
  useEffect(() => {
    const iframe = ref.current;
    if (!iframe) return;
    const onLoad = () => {
      try {
        const doc = iframe.contentDocument;
        if (!doc) return;
        const style = doc.createElement('style');
        style.textContent = baseCSS;
        doc.head.appendChild(style);
        const wraps = doc.querySelectorAll('.frame-wrap');
        wraps.forEach((w, i) => {
          w.style.setProperty('display', i === targetIndex ? 'flex' : 'none', 'important');
        });
      } catch (e) {
        console.warn('inject failed', src, e);
      }
    };
    iframe.addEventListener('load', onLoad);
    return () => iframe.removeEventListener('load', onLoad);
  }, [src, targetIndex]);
  return (
    <iframe
      ref={ref}
      className="section-frame"
      src={src}
      style={{ width, height, display: 'block' }}
    />
  );
}

/* ----------------------------------------------------------------
   Top of page — synthesis frame: all desktop frames stacked
   Reuses landing.html as a single artboard so reviewers can flip
   between "stitched view" and "atomized canvas" instantly.
---------------------------------------------------------------- */
function App() {
  return (
    <DesignCanvas>

      {/* === Synthesis row: the stitched landing as one artboard === */}
      <DCSection id="synthesis" title="The full landing · stitched" subtitle="One scrollable composition · same source files as the atomized canvas below">
        <DCArtboard id="full" label="Full landing · 1440 · scroll inside the artboard" width={1440} height={1200}>
          <iframe className="section-frame" src="landing.html" style={{ width: 1440, height: 1200 }} />
        </DCArtboard>
        <DCPostIt top={40} left={-210} rotate={-3} width={210}>
          The synthesis: every section stitched. Scroll inside the frame to walk the full page. Below — every section atomized, desktop + mobile side-by-side, for focused review.
        </DCPostIt>
      </DCSection>

      {/* === Atomized canvas: one section per row === */}
      {SECTIONS.map(sec => (
        <DCSection key={sec.id} id={sec.id} title={sec.title} subtitle={sec.subtitle}>
          {sec.frames.map(f => (
            <DCArtboard key={f.id} id={f.id} label={f.label} width={f.w} height={f.h}>
              <SectionFrame src={f.src} targetIndex={f.idx} width={f.w} height={f.h} />
            </DCArtboard>
          ))}
          {(sec.notes || []).map((n, i) => (
            <DCPostIt key={i} top={n.top} left={n.left} right={n.right} rotate={n.rotate || -2} width={200}>
              {n.text}
            </DCPostIt>
          ))}
        </DCSection>
      ))}

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
