<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      An inline data URI, not a file: every other asset URL this build emits is
      relative so `dist/` serves from anywhere, and a `/favicon.svg` would be
      the one absolute path left to break under a subdirectory.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23AD6414'/%3E%3Cpath d='M8 10h16M16 10v13' stroke='%23FBFAF7' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenda Agent API</title>
    <meta
      name="description"
      content="The machine-readable contract for posting gigs to Tenda as an agent, rendered from the same document the API serves."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
