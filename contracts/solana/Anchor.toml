[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
tenda_escrow = "cU6Z67oRepxKfiaCUKTqHiXMWVifFdYpVG1QC4SR6Eb"

[programs.localnet]
tenda_escrow = "cU6Z67oRepxKfiaCUKTqHiXMWVifFdYpVG1QC4SR6Eb"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Delegates rather than repeating the invocation. The LiteSVM suite needs
# `--node-option expose-gc` and `--require ./tests/root-hooks.ts` or it leaks
# ~12 MB per test (see tests/root-hooks.ts); spelling the command out twice is
# how this file ended up running the same glob without either of them, so
# `anchor test` silently rebuilt the leak that package.json had already fixed.
# One definition, in package.json, checked by tests/harness-wiring.test.ts.
test = "pnpm test"
# Not delegated: tests-devnet runs against a real cluster and never constructs
# a LiteSVM, so it needs neither the flag nor the hook — and it carries its own
# far longer timeout.
test-devnet = "pnpm exec ts-mocha -p ./tsconfig.json -t 600000 \"tests-devnet/**/*.test.ts\""
